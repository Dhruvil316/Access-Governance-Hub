spring:
  cloud:
    config:
      enabled: false

  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:auth_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
