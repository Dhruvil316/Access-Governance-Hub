jwt :
  secretKey : "pHnv7b6IZH3mFtiHBhdLo3GYB9LgNDByMAs5lruRlPw="

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id : posts-service
              uri : http://localhost:9010
              predicates:
                  - Path=/posts/** ,/likes/**
              filters :
                - name : Authentication
                  args :
                    isEnabled : true

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO